<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Mobile Store</title>
    <style>
        :root {
            --bg-color: #1a1d24;
            --text-color: #e2e8f0;
            --card-bg: #2d3748;
            --accent-color: #f59e0b;
            --border-color: #4a5568;
        }

        * { box-sizing: border-box; font-family: sans-serif; }
        
        body { 
            background-color: var(--bg-color);
            background-image: url('https://wallpapercave.com/wp/wp4967669.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color); 
            padding: 20px; 
            margin: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 29, 36, 0.85);
            z-index: -1;
        }

        .container { 
            max-width: 450px; 
            margin: 0 auto; 
            background: rgba(45, 55, 72, 0.95); 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }
        
        h2 { text-align: center; color: var(--accent-color); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        
        .points-box { 
            background: #1a1d24; 
            color: var(--accent-color); 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            margin-bottom: 15px; 
            border: 1px solid var(--border-color);
            font-weight: bold;
        }
        
        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-row button, .btn-row a { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            text-decoration: none; 
            text-align: center; 
            cursor: pointer; 
            color: white; 
            transition: background 0.3s;
        }
        
        .ad-btn { background: #2563eb; } 
        .ad-btn:hover { background: #1d4ed8; }
        
        .pay-btn { background: #7c3aed; } 
        .pay-btn:hover { background: #6d28d9; }
        
        .payment-info { 
            background: #1a1d24; 
            color: #e2e8f0; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            margin-bottom: 15px; 
            display: none; 
            text-align: right; 
            border: 1px solid var(--border-color);
            line-height: 1.6;
        }
        
        label { color: #a0aec0; font-size: 0.9rem; margin-bottom: 5px; display: block; }

        select, input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background: var(--card-bg); 
            color: var(--text-color); 
            margin-bottom: 15px; 
            font-size: 1rem;
        }
        
        select:focus, input:focus { outline: 2px solid var(--accent-color); border-color: transparent; }

        .btn-order { 
            width: 100%; 
            background: var(--accent-color); 
            color: #1a1d24; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1.1rem;
            transition: background 0.3s;
        }
        .btn-order:hover { background: #d97706; }

        #timerDisplay { text-align:center; color: var(--accent-color); font-weight:bold; margin-bottom:10px; min-height: 1.2em; }
        #confirmBtn { width:100%; display:none; padding:12px; background:#059669; color:white; border:none; border-radius:8px; margin-bottom:15px; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <h2>PUBG STORE</h2>
    <div class="points-box">
        رصيدك الحالي: <span id="points">0</span> نقطة 🎁<br>
        <span id="limitDisplay" style="font-size: 0.85rem; color: #a0aec0;">إعلانات اليوم: 0 / 10</span>
    </div>

    <div class="btn-row">
        <a id="adLink" href="https://astrayentireillegimateillegimate.com/xuczf83gci?key=b049f11290e19a94e15a9f6e20a5ceb8" target="_blank" class="ad-btn" onclick="startTimer()">📺 مشاهدة إعلان</a>
        <button class="pay-btn" onclick="togglePay()">💰 طرق الدفع</button>
    </div>

    <div id="payInfo" class="payment-info">
        <b>طرق التحويل المتاحة:</b><br>
        📱 فودافون كاش: <b>01070530900</b><br>
        🌍 باي بال (PayPal): <b>nasfgy65@gmail.com</b>
    </div>

    <div id="timerDisplay"></div>
    <button id="confirmBtn" onclick="confirmPoint()">✅ تأكيد المشاهدة والحصول على النقطة</button>

    <label>اختر الباقة:</label>
    <select id="package">
        <option value="60 UC - 55 EGP">60 شدة - 55 جنيه</option>
        <option value="325 UC - 260 EGP">325 شدة - 260 جنيه</option>
        <option value="660 UC - 480 EGP">660 شدة - 480 جنيه</option>
        <option value="1800 UC - 1250 EGP">1800 شدة - 1250 جنيه</option>
    </select>
    
    <label>أدخل الآيدي (ID) الخاص بك:</label>
    <input type="text" id="playerId" placeholder="مثال: 5123456789">

    <button class="btn-order" onclick="sendOrder()">إرسال الطلب عبر واتساب 🚀</button>
</div>

<script>
    let userPoints = 0;
    let maxAdsPerDay = 10; 
    
    checkDailyLimit();

    function togglePay() { 
        let p = document.getElementById('payInfo'); 
        p.style.display = (p.style.display === 'block') ? 'none' : 'block'; 
    }

    function getTodayDate() {
        return new Date().toISOString().slice(0, 10);
    }

    function checkDailyLimit() {
        let lastDate = localStorage.getItem('adDate');
        let currentDate = getTodayDate();
        
        if (lastDate !== currentDate) {
            localStorage.setItem('adDate', currentDate);
            localStorage.setItem('adsWatchedToday', '0');
        }

        let watchedToday = parseInt(localStorage.getItem('adsWatchedToday') || '0');
        document.getElementById('limitDisplay').innerText = `إعلانات اليوم: ${watchedToday} / ${maxAdsPerDay}`;

        if (watchedToday >= maxAdsPerDay) {
            let adBtn = document.getElementById('adLink');
            adBtn.style.pointerEvents = 'none';
            adBtn.style.opacity = '0.5';
            adBtn.innerText = '🔒 لقد وصلت للحد الأقصى اليومي';
        }
    }
    
    function startTimer() {
        let watchedToday = parseInt(localStorage.getItem('adsWatchedToday') || '0');
        if (watchedToday >= maxAdsPerDay) {
            alert("لقد استنفدت الحد الأقصى لمشاهدة الإعلانات اليوم (10 إعلانات). حاول غداً!");
            return;
        }

        let timerDiv = document.getElementById('timerDisplay');
        let btn = document.getElementById('adLink');
        let timeLeft = 20;
        
        btn.style.pointerEvents = 'none';
        btn.style.opacity = '0.6';
        timerDiv.innerText = `⏳ الرجاء الانتظار ${timeLeft} ثوانٍ...`;

        let timer = setInterval(() => {
            timeLeft--;
            timerDiv.innerText = `⏳ الرجاء الانتظار ${timeLeft} ثوانٍ...`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerDiv.innerText = "";
                document.getElementById('confirmBtn').style.display = 'block';
                btn.style.display = 'none';
            }
        }, 1000);
    }

    function confirmPoint() {
        userPoints++;
        document.getElementById('points').innerText = userPoints;
        
        let watchedToday = parseInt(localStorage.getItem('adsWatchedToday') || '0');
        watchedToday++;
        localStorage.setItem('adsWatchedToday', watchedToday);

        document.getElementById('confirmBtn').style.display = 'none';
        let btn = document.getElementById('adLink');
        btn.style.display = 'block';
        btn.style.pointerEvents = 'auto';
        btn.style.opacity = '1';
        
        checkDailyLimit();
        alert("تم إضافة النقطة بنجاح!");
    }

    function sendOrder() {
        let pkg = document.getElementById('package').value;
        let id = document.getElementById('playerId').value;
        
        if (!id.trim()) {
            alert("يرجى إدخال الآيدي أولاً");
            return;
        }

        let msg = `*طلب شحن جديد - PUBG Mobile*%0A` +
                  `------------------%0A` +
                  `👤 الآيدي: ${id}%0A` +
                  `📦 الباقة: ${pkg}%0A` +
                  `💳 تم التحويل عبر: (فودافون كاش: 01070530900 / باي بال)%0A` +
                  `------------------%0A` +
                  `🎁 النقاط المستخدمة/المتاحة: ${userPoints}`;
                  
        window.location.href = `https://wa.me/447961684235?text=${msg}`;
    }
</script>
</body>
</html>
