<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - متجر الشحن</title>
    
    <!-- خط القاهرة العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- كود إعلان Adsterra (Social Bar) -->
    <script src="https://astrayentireillegimateillegimate.com/8f/d4/cf/8fd4cf8c3812fab789041073f45a005e.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #0b1120 0%, #1e1b4b 100%); 
            color: #f8fafc; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container { 
            width: 100%;
            max-width: 480px; 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(10px);
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h2 { 
            text-align: center; 
            color: #fbbf24; 
            margin-bottom: 20px; 
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .points-box { 
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 20px; 
            border: 1px dashed #fbbf24; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .points-box span { 
            color: #fbbf24; 
            font-weight: 900; 
            font-size: 1.5rem; 
        }

        .ad-link-btn { 
            display: block; 
            width: 100%; 
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); 
            color: #fff; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: 700; 
            text-decoration: none; 
            text-align: center; 
            margin-top: 10px; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        .ad-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        #timerDisplay {
            text-align: center; 
            margin-top: 12px; 
            color: #fbbf24; 
            font-weight: 700;
            font-size: 0.95rem;
        }
        
        #confirmBtn { 
            width: 100%; 
            background: linear-gradient(135deg, #10b981 0%, #047857 100%); 
            color: #fff; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            margin-top: 12px; 
            display: none; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        #confirmBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .form-group { 
            margin-top: 25px; 
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        select, input { 
            width: 100%; 
            padding: 12px 15px; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: #fff; 
            margin-bottom: 15px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        select:focus, input:focus {
            border-color: #fbbf24;
        }

        .btn-order { 
            width: 100%; 
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); 
            color: #0f172a; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 800; 
            margin-top: 5px; 
            cursor: pointer; 
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
            transition: all 0.3s ease;
        }

        .btn-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ GAME STORE ⚡</h2>
    <div class="points-box">
        رصيدك الحالي: <span id="points">0</span> نقطة 🎁
    </div>

    <!-- زر الإعلان -->
    <a href="https://astrayentireillegimateillegimate.com/xuczf83gci?key=b049f11290e19a94e15a9f6e20a5ceb8" 
       target="_blank" 
       class="ad-link-btn" 
       onclick="startTimer()">📺 اضغط هنا لمشاهدة الإعلان (20 ثانية)</a>

    <div id="timerDisplay"></div>
    
    <button id="confirmBtn" onclick="confirmPoint()">✅ تأكيد المشاهدة والحصول على النقطة</button>

    <div class="form-group">
        <label>اختر الباقة المطلوبة:</label>
        <select id="package">
            <option value="60 UC - 55 EGP">60 شدة - 55 جنيه</option>
            <option value="325 UC - 260 EGP">325 شدة - 260 جنيه</option>
            <option value="660 UC - 480 EGP">660 شدة - 480 جنيه</option>
            <option value="1800 UC - 1250 EGP">1800 شدة - 1250 جنيه</option>
        </select>
        
        <label>الآيدي الخاص بك (ID):</label>
        <input type="text" id="playerId" placeholder="مثال: 5123456789">
    </div>

    <button class="btn-order" onclick="sendOrder()">إرسال الطلب عبر واتساب 🚀</button>
</div>

<script>
    let userPoints = 0;
    
    function startTimer() {
        let timerDiv = document.getElementById('timerDisplay');
        let timeLeft = 20;
        document.querySelector('.ad-link-btn').style.display = 'none'; 

        let timer = setInterval(() => {
            timeLeft--;
            timerDiv.innerText = `⏳ انتظر ${timeLeft} ثوانٍ في صفحة الإعلان...`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerDiv.innerText = "✅ انتهى الوقت!";
                document.getElementById('confirmBtn').style.display = 'block';
            }
        }, 1000);
    }

    function confirmPoint() {
        userPoints += 1;
        document.getElementById('points').innerText = userPoints;
        document.getElementById('confirmBtn').style.display = 'none';
        document.querySelector('.ad-link-btn').style.display = 'block';
        document.getElementById('timerDisplay').innerText = "";
        alert("تم إضافة النقطة بنجاح!");
    }

    function sendOrder() {
        let pkg = document.getElementById('package').value;
        let playerId = document.getElementById('playerId').value.trim();
        
        if(!playerId) { 
            alert("يرجى إدخال الآيدي (ID) أولاً!"); 
            return; 
        }
        
        // التحقق من الخصم والخصم من النقاط إن وجد
        let discountText = "لا يوجد";
        if(userPoints >= 25) {
            userPoints -= 25;
            document.getElementById('points').innerText = userPoints;
            discountText = "خصم 5 جنيه (مستخدم من النقاط 🎉)";
        }
        
        // تصميم رسالة الواتساب لتكون منظمة، احترافية، ومريحة جداً للمتجر
        let message = `*🔥 طلب شحن جديد - Game Store 🔥*` +
                      `%0A----------------------------------` +
                      `%0A📦 *الباقة المطلوبة:* ${pkg}` +
                      `%0A🆔 *آيدي اللاعب:* ${playerId}` +
                      `%0A🎁 *الخصم / النقاط:* ${discountText}` +
                      `%0A----------------------------------` +
                      `%0A✨ يرجى تأكيد الطلب ومتابعة الدفع.`;
        
        window.location.href = `https://wa.me/447961684235?text=${message}`;
    }
</script>
</body>
</html>
