<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store</title>
    
    <!-- كود إعلان Adsterra (Social Bar) الجديد -->
    <script src="https://astrayentireillegimateillegimate.com/8f/d4/cf/8fd4cf8c3812fab789041073f45a005e.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding: 20px; }
        .container { max-width: 450px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #f59e0b; margin-bottom: 20px; }
        .points-box { background: #334155; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; border: 1px dashed #f59e0b; }
        .points-box span { color: #f59e0b; font-weight: bold; font-size: 1.4rem; }
        /* تغيير شكل الزر ليكون رابطاً حقيقياً يثق فيه المتصفح */
        .ad-link-btn { display: block; width: 100%; background: #3b82f6; color: #fff; padding: 15px; border-radius: 8px; font-weight: bold; text-decoration: none; text-align: center; margin-top: 10px; }
        #confirmBtn { width: 100%; background: #10b981; color: #fff; padding: 15px; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; display: none; cursor: pointer; }
        .form-group { margin-top: 20px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-top: 5px; }
        .btn-order { width: 100%; background: #f59e0b; color: #000; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ GAME STORE ⚡</h2>
    <div class="points-box">
        رصيدك: <span id="points">0</span> نقطة 🎁
    </div>

    <!-- الحل الجذري: استخدام رابط مباشر بـ target="_blank" -->
    <a href="https://astrayentireillegimateillegimate.com/xuczf83gci?key=b049f11290e19a94e15a9f6e20a5ceb8" 
       target="_blank" 
       class="ad-link-btn" 
       onclick="startTimer()">📺 اضغط هنا لمشاهدة الإعلان (20 ثانية)</a>

    <div id="timerDisplay" style="text-align:center; margin-top:10px; color:#f59e0b; font-weight:bold;"></div>
    
    <button id="confirmBtn" onclick="confirmPoint()">✅ تأكيد المشاهدة والحصول على النقطة</button>

    <div class="form-group">
        <label>اختر الباقة:</label>
        <select id="package">
            <option value="60 UC - 55 EGP">60 شدة - 55 جنيه</option>
            <option value="325 UC - 260 EGP">325 شدة - 260 جنيه</option>
            <option value="660 UC - 480 EGP">660 شدة - 480 جنيه</option>
            <option value="1800 UC - 1250 EGP">1800 شدة - 1250 جنيه</option>
        </select>
        <label>الآيدي (ID):</label>
        <input type="text" id="playerId" placeholder="مثال: 5123456789">
    </div>

    <button class="btn-order" onclick="sendOrder()">إرسال الطلب عبر واتساب 🚀</button>
</div>

<script>
    let userPoints = 0;
    
    function startTimer() {
        // بمجرد الضغط، يبدأ العداد
        let timerDiv = document.getElementById('timerDisplay');
        let timeLeft = 20;
        document.querySelector('.ad-link-btn').style.display = 'none'; // إخفاء الزر بعد الضغط

        let timer = setInterval(() => {
            timeLeft--;
            timerDiv.innerText = `⏳ انتظر ${timeLeft} ثوانٍ في صفحة الإعلان...`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerDiv.innerText = "✅ انتهى الوقت!";
                document.getElementById('confirmBtn').style.display = 'block';
            }
        }, 1000);
    }

    function confirmPoint() {
        userPoints += 1;
        document.getElementById('points').innerText = userPoints;
        document.getElementById('confirmBtn').style.display = 'none';
        document.querySelector('.ad-link-btn').style.display = 'block';
        document.getElementById('timerDisplay').innerText = "";
        alert("تم إضافة النقطة!");
    }

    function sendOrder() {
        let pkg = document.getElementById('package').value;
        let playerId = document.getElementById('playerId').value;
        if(!playerId) { alert("أدخل الآيدي!"); return; }
        
        let discount = (userPoints >= 25) ? "%0A- *خصم:* 5 جنيه (من نقاطك)" : "";
        if(userPoints >= 25) { userPoints -= 25; document.getElementById('points').innerText = userPoints; }
        
        window.location.href = `https://wa.me/447961684235?text=طلب شحن:%0A${pkg}%0Aالآيدي: ${playerId}${discount}`;
    }
</script>
</body>
</html>
